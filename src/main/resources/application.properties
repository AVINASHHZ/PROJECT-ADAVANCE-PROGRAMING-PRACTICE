# Shadow Reborn: Production Server Configuration
server.port=${PORT:8080}
server.address=0.0.0.0

# Static Resource Handling (serves src/main/resources/static/index.html)
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0

# Save data file directory
game.save.path=data/shadow_reborn_save.json

# Logging
logging.level.root=INFO
logging.level.com.shadowreborn=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
